version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/sektor-ai/material-review-starter/go/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../go/gen
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.1
    out: ../go/gen
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v2.17.0
    out: ../ts/packages/api/src/gen
    opt: target=ts
